<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Library App</title>
<!--  Tailwind Css-->
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <style type="text/tailwindcss">
      
        
        
</style>

<body class="bg-indigo-800 p-10">
     <div class="bg-white p-5 rounded max-w-xl mx-auto">
        
       <h4 class="font-semibold text-xl">Book Library</h4>

       <form  name ="bookForm" class="space-y-4 mt-3">
       <input type="text" id="bookTitle" placeholder="Book Title" class="px-4 py-2 rounded bg-gray-100 outline-none w-full" required>
         <input type="text" id="bookAuthor" placeholder="Book Author" class="px-4 py-2 rounded bg-gray-100 outline-none w-full" required>
       <button type="submit" class="px-3 py-1 bg-orange-500 rounded uppercase font-semibold text-sm text-white"> ADD BOOk</button>
       </form>
     </div>
<!-- added Books Section -->
     <section class="bg-white p-5 rounded max-w-xl mx-auto mt-5">
           <h4 class="font-semibold text-xl">Added Books(<span id="bookCount">0</span>)</h4>

           <ul class="mt-3 space-y-2" id="renderdLibrary">
            
           </ul>

     </section>
     <script src="./assets/js/data/Library.js"></script>
     <script src="./assets/js/data/Book.js"></script>
     <script src="./assets/js/main.js"></script>
</body>
</html>
